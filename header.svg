<svg viewBox="0 0 800 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="panel-clip">
      <rect x="62" y="65" width="4" height="335" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" fill="#050508" rx="12" />

  <!-- ================= LCARS FRAME STRUCTURE ================= -->

  <!-- Top-Left Elbow (Sweep) -->
  <path d="M 20,20 H 140 V 52 H 75 A 15,15 0 0,0 60,67 V 110 H 20 V 35 A 15,15 0 0,1 35,20 Z" fill="#FF9900" />
  
  <!-- Top Horizontal Header Bar -->
  <rect x="148" y="20" width="460" height="32" fill="#FF9900" />
  <rect x="616" y="20" width="164" height="32" fill="#CC99CC" rx="16" />
  <text x="160" y="41" fill="#000000" font-weight="bold" font-size="14" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">LCARS 24-47 // COMMAND DIRECTIVE PROFILE</text>
  <text x="632" y="41" fill="#000000" font-weight="bold" font-size="13" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">SYS ONLINE</text>

  <!-- Left Sidebar Button Stack with SMIL Animations -->
  <rect x="20" y="116" width="40" height="28" fill="#FFCC99" rx="3">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
  </rect>
  <text x="25" y="134" fill="#000000" font-size="10" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" font-weight="bold" letter-spacing="1.5">47</text>

  <rect x="20" y="148" width="40" height="42" fill="#CC99CC" rx="3">
    <animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite" />
  </rect>
  <text x="25" y="172" fill="#000000" font-size="10" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" font-weight="bold" letter-spacing="1.5">9204</text>

  <rect x="20" y="194" width="40" height="20" fill="#99CCFF" rx="3" />
  
  <rect x="20" y="218" width="40" height="55" fill="#FF9900" rx="3">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
  </rect>
  <text x="25" y="248" fill="#000000" font-size="10" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" font-weight="bold" letter-spacing="1.5">OPS</text>

  <rect x="20" y="277" width="40" height="30" fill="#CC3333" rx="3">
    <animate attributeName="fill" values="#CC3333;#FF6666;#CC3333" dur="0.8s" repeatCount="indefinite" />
  </rect>
  <text x="25" y="296" fill="#000000" font-size="10" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" font-weight="bold" letter-spacing="1.5">ALT</text>

  <rect x="20" y="311" width="40" height="35" fill="#6699CC" rx="3">
    <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <text x="25" y="332" fill="#000000" font-size="10" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" font-weight="bold" letter-spacing="1.5">NET</text>

  <!-- Bottom-Left Elbow (Sweep) -->
  <path d="M 20,350 H 60 V 393 A 15,15 0 0,0 75,408 H 140 V 440 H 35 A 15,15 0 0,1 20,425 V 350 Z" fill="#FFCC99" />

  <!-- Bottom Horizontal Footer Bar -->
  <rect x="148" y="408" width="500" height="32" fill="#99CCFF" />
  <rect x="656" y="408" width="124" height="32" fill="#FF9900" rx="16" />
  <text x="160" y="429" fill="#000000" font-weight="bold" font-size="13" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">STARDATE 10425.8 // FEDERATION DATABASE ACCESS</text>
  <text x="672" y="429" fill="#000000" font-weight="bold" font-size="13" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">RECORDS</text>

  <!-- Sidebar Vertical Telemetry Scanner -->
  <rect x="62" y="65" width="4" height="335" fill="#99CCFF" opacity="0.2" />
  <g clip-path="url(#panel-clip)">
    <rect x="60" y="65" width="8" height="40" fill="#99CCFF" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 330" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= MAIN CONTENT PANEL ================= -->

  <!-- Officer Identification Header -->
  <text x="175" y="94" fill="#FF9900" font-size="32" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">
    MIKE TAYLOR
    <animate attributeName="fill" values="#FF9900;#FFCC66;#FF9900" dur="2.5s" repeatCount="indefinite" />
  </text>
  <text x="365" y="94" fill="#FFCC99" font-size="16" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">// PERSONNEL DOSSIER</text>

  <text x="175" y="116" fill="#99CCFF" font-size="11" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">
    LOCATION: <tspan fill="#FFFFFF">NORTHERN VIRGINIA</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    CLEARANCE: <tspan fill="#FFCC99">LEVEL 10</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    STATUS: <tspan fill="#66FF66">ONLINE</tspan><tspan fill="#66FF66">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan>
  </text>

  <!-- Sub-divider line -->
  <line x1="175" y1="126" x2="770" y2="126" stroke="#CC99CC" stroke-width="2" stroke-dasharray="6 3" opacity="0.7" />

  <!-- SECTION 1: CORE SOFTWARE & PLATFORMS -->
  <g transform="translate(0, 5)">
    <rect x="175" y="138" width="225" height="22" fill="#CC99CC" rx="11" />
    <text x="190" y="153" fill="#000000" font-size="12" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">01 // CORE SYSTEM SOFTWARE</text>
    <line x1="408" y1="149" x2="770" y2="149" stroke="#CC99CC" stroke-width="2" opacity="0.6" />

    <!-- Badges -->
    <rect x="175" y="170" width="155" height="24" fill="#FF9900" rx="12" />
    <text x="187" y="186" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">LINUX OS ARCHITECTURE</text>

    <rect x="338" y="170" width="85" height="24" fill="#FFCC99" rx="12" />
    <text x="350" y="186" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">PYTHON 3</text>

    <rect x="431" y="170" width="75" height="24" fill="#99CCFF" rx="12" />
    <text x="443" y="186" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">SQLITE</text>

    <rect x="514" y="170" width="155" height="24" fill="#CC99CC" rx="12" />
    <text x="526" y="186" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">HTML5 / CSS3 / JS</text>
  </g>

  <!-- SECTION 2: INFRASTRUCTURE & AUTOMATION -->
  <g transform="translate(0, 5)">
    <rect x="175" y="212" width="235" height="22" fill="#99CCFF" rx="11" />
    <text x="190" y="227" fill="#000000" font-size="12" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">02 // INFRASTRUCTURE &amp; DEVOPS</text>
    <line x1="418" y1="223" x2="770" y2="223" stroke="#99CCFF" stroke-width="2" opacity="0.6" />

    <!-- Badges Row 1 -->
    <rect x="175" y="244" width="165" height="24" fill="#99CCFF" rx="12" />
    <text x="187" y="260" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">DOCKER &amp; SWARM</text>

    <rect x="348" y="244" width="200" height="24" fill="#FFCC99" rx="12" />
    <text x="360" y="260" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">FORGEJO &amp; GITHUB ACTIONS</text>

    <rect x="556" y="244" width="135" height="24" fill="#FF9900" rx="12" />
    <text x="568" y="260" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">HARBOR REGISTRY</text>

    <!-- Badges Row 2 -->
    <rect x="175" y="276" width="170" height="24" fill="#6699CC" rx="12" />
    <text x="187" y="292" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">NGINX PROXY MANAGER</text>

    <rect x="353" y="276" width="130" height="24" fill="#CC99CC" rx="12" />
    <text x="365" y="292" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">CI/CD PIPELINES</text>
  </g>

  <!-- SECTION 3: AI & MODEL INTEGRATION -->
  <g transform="translate(0, 5)">
    <rect x="175" y="318" width="230" height="22" fill="#FF9900" rx="11" />
    <text x="190" y="333" fill="#000000" font-size="12" font-weight="700" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">03 // AI &amp; MODEL INTEGRATION</text>
    <line x1="413" y1="329" x2="770" y2="329" stroke="#FF9900" stroke-width="2" opacity="0.6" />

    <!-- Badges -->
    <rect x="175" y="350" width="115" height="24" fill="#FF9900" rx="12" />
    <text x="187" y="366" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">OPEN WEBUI</text>

    <rect x="298" y="350" width="140" height="24" fill="#FFCC99" rx="12" />
    <text x="310" y="366" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">GEMMA MODELS</text>

    <rect x="446" y="350" width="155" height="24" fill="#99CCFF" rx="12" />
    <text x="458" y="366" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">QWEN ARCHITECTURE</text>

    <rect x="609" y="350" width="115" height="24" fill="#CC99CC" rx="12" />
    <text x="621" y="366" fill="#000000" font-size="11" font-weight="bold" font-family="'Trebuchet MS', 'Arial Narrow', sans-serif" letter-spacing="1.5">DEEPSEEK-R1</text>
  </g>
</svg>
