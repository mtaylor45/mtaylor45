<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" role="img" aria-label="Mike Taylor — LCARS Profile Banner">
  <defs>
    <!-- Classic LCARS palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Soft glow for active elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#99CCFF" opacity="0.04"/>
    </pattern>

    <!-- System fonts that render cleanly on GitHub -->
    <style>
      .lcars-text {
        font-family: 'Helvetica Neue', 'Arial Narrow', Arial, 'Segoe UI', sans-serif;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .lcars-label {
        font-family: 'Helvetica Neue', 'Arial Narrow', Arial, 'Segoe UI', sans-serif;
        font-weight: 600;
        letter-spacing: 0.14em;
        font-size: 11px;
      }
      .lcars-small {
        font-family: 'Helvetica Neue', Arial, 'Segoe UI', sans-serif;
        font-weight: 500;
        letter-spacing: 0.08em;
        font-size: 10px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" rx="8"/>
  <rect width="900" height="320" fill="url(#scanlines)" rx="8"/>

  <!-- ========== TOP FRAME ========== -->
  <!-- Top-left elbow -->
  <path d="M 18 18 H 160 V 48 H 78 A 18 18 0 0 0 60 66 V 110 H 18 V 36 A 18 18 0 0 1 36 18 Z"
        fill="#FF9900"/>
  <!-- Top bar -->
  <rect x="168" y="18" width="520" height="30" fill="#FF9900" rx="2"/>
  <!-- Top-right capsule -->
  <rect x="696" y="18" width="186" height="30" fill="#CC99CC" rx="15"/>

  <!-- Top bar labels -->
  <text x="185" y="38" class="lcars-label" fill="#000000">LCARS 24-47 // COMMAND DIRECTIVE</text>
  <text x="715" y="38" class="lcars-label" fill="#000000">SYS ONLINE</text>

  <!-- Animated status pulse on top-right -->
  <circle cx="868" cy="33" r="5" fill="#66FF66">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ========== LEFT SIDEBAR ========== -->
  <!-- Vertical stack of LCARS buttons -->
  <rect x="18" y="118" width="42" height="26" fill="#FFCC99" rx="4"/>
  <rect x="18" y="150" width="42" height="38" fill="#CC99CC" rx="4"/>
  <rect x="18" y="194" width="42" height="22" fill="#99CCFF" rx="4"/>
  <rect x="18" y="222" width="42" height="48" fill="#FF9900" rx="4"/>
  <rect x="18" y="276" width="42" height="26" fill="#CC3333" rx="4"/>

  <!-- Button labels (tiny) -->
  <text x="39" y="135" text-anchor="middle" class="lcars-small" fill="#000">OPS</text>
  <text x="39" y="172" text-anchor="middle" class="lcars-small" fill="#000">AI</text>
  <text x="39" y="209" text-anchor="middle" class="lcars-small" fill="#000">GEO</text>
  <text x="39" y="248" text-anchor="middle" class="lcars-small" fill="#000">HUD</text>
  <text x="39" y="293" text-anchor="middle" class="lcars-small" fill="#000">SYS</text>

  <!-- Animated scanner line on left rail -->
  <rect x="66" y="66" width="3" height="240" fill="#99CCFF" opacity="0.25"/>
  <rect x="66" y="66" width="3" height="36" fill="#99CCFF" opacity="0.95" filter="url(#glow)">
    <animate attributeName="y" values="66;270;66" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom-left elbow -->
  <path d="M 18 310 H 60 V 280 A 18 18 0 0 1 78 262 H 160 V 310 H 36 A 18 18 0 0 1 18 292 Z"
        fill="#FFCC99"/>

  <!-- ========== MAIN CONTENT ========== -->
  <!-- Name -->
  <text x="95" y="95" class="lcars-text" font-size="32" fill="#FF9900" filter="url(#glow)">MIKE TAYLOR</text>

  <!-- Subtitle / rank style -->
  <text x="95" y="118" class="lcars-label" fill="#FFCC99">// PERSONNEL DOSSIER</text>

  <!-- Location + status line -->
  <text x="95" y="142" class="lcars-small" fill="#99CCFF">NORTHERN VIRGINIA  •  SECTOR 001</text>
  <text x="420" y="142" class="lcars-small" fill="#66FF66">STATUS: ACTIVE</text>

  <!-- Divider -->
  <line x1="95" y1="155" x2="870" y2="155" stroke="#CC99CC" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Project / focus panels -->
  <!-- Panel 1 -->
  <rect x="95" y="170" width="240" height="22" fill="#CC99CC" rx="11"/>
  <text x="115" y="185" class="lcars-label" fill="#000000">WORLD MONITOR</text>
  <text x="350" y="185" class="lcars-small" fill="#FFCC99">LCARS situational awareness console</text>

  <!-- Panel 2 -->
  <rect x="95" y="200" width="240" height="22" fill="#99CCFF" rx="11"/>
  <text x="115" y="215" class="lcars-label" fill="#000000">CLAUDE HUD LCARS</text>
  <text x="350" y="215" class="lcars-small" fill="#FFCC99">operations dashboard for agent tooling</text>

  <!-- Panel 3 -->
  <rect x="95" y="230" width="240" height="22" fill="#FF9900" rx="11"/>
  <text x="115" y="245" class="lcars-label" fill="#000000">LOCAL AI SYSTEMS</text>
  <text x="350" y="245" class="lcars-small" fill="#FFCC99">private, continuous, system-aware models</text>

  <!-- Right side status blocks -->
  <g transform="translate(680, 168)">
    <rect x="0" y="0" width="190" height="18" fill="#3366CC" rx="4"/>
    <text x="10" y="13" class="lcars-small" fill="#FFFFFF">LOCAL-FIRST AI</text>
    <rect x="0" y="24" width="190" height="18" fill="#664466" rx="4"/>
    <text x="10" y="37" class="lcars-small" fill="#FFFFFF">GEOSPATIAL VIZ</text>
    <rect x="0" y="48" width="190" height="18" fill="#FF9900" rx="4"/>
    <text x="10" y="61" class="lcars-small" fill="#000000">DESIGN SYSTEMS</text>
    <rect x="0" y="72" width="190" height="18" fill="#99CCFF" rx="4"/>
    <text x="10" y="85" class="lcars-small" fill="#000000">SELF-HOSTED INFRA</text>
  </g>

  <!-- Animated data stream / ticks on right -->
  <g fill="#66FF66" opacity="0.8">
    <rect x="880" y="175" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="185" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="195" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="205" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="215" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="225" width="8" height="4" rx="1">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="1.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ========== BOTTOM BAR ========== -->
  <rect x="168" y="282" width="530" height="28" fill="#99CCFF" rx="2"/>
  <rect x="706" y="282" width="176" height="28" fill="#FF9900" rx="14"/>

  <text x="185" y="300" class="lcars-label" fill="#000000">BUILD SYSTEMS • MAKE THEM VISIBLE • KEEP THEM YOURS</text>
  <text x="740" y="300" class="lcars-label" fill="#000000">READY</text>

  <!-- Subtle horizontal scan sweep across content area -->
  <rect x="90" y="160" width="780" height="2" fill="#FF9900" opacity="0.35" filter="url(#glow)">
    <animate attributeName="y" values="160;270;160" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accent ticks -->
  <rect x="870" y="50" width="12" height="3" fill="#FF9900"/>
  <rect x="879" y="50" width="3" height="12" fill="#FF9900"/>
  <rect x="870" y="268" width="12" height="3" fill="#99CCFF"/>
  <rect x="879" y="259" width="3" height="12" fill="#99CCFF"/>
</svg>