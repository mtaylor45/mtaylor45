<svg viewBox="0 0 800 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      <![CDATA[
      .lcars-text {
        font-family: 'Trebuchet MS', 'Arial Narrow', 'Impact', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* LCARS Color Palette */
      .bg-dark { fill: #050508; }
      .lcars-gold { fill: #FF9900; }
      .lcars-tan { fill: #FFCC99; }
      .lcars-lilac { fill: #CC99CC; }
      .lcars-blue { fill: #99CCFF; }
      .lcars-slate { fill: #6699CC; }
      .lcars-red { fill: #CC3333; }

      /* Keyframe Animations */
      .blink-slow {
        animation: pulseSlow 3.2s ease-in-out infinite alternate;
      }
      .blink-mid {
        animation: pulseMid 1.8s ease-in-out infinite alternate;
      }
      .blink-fast {
        animation: pulseFast 0.8s steps(2, start) infinite;
      }
      .scanner-beam {
        animation: scanAnim 4s linear infinite;
      }
      .title-glow {
        animation: titleGlow 2.5s ease-in-out infinite alternate;
      }
      .cursor-blink {
        animation: cursorBlink 1s step-end infinite;
      }

      @keyframes pulseSlow {
        0% { opacity: 1.0; }
        50% { opacity: 0.35; }
        100% { opacity: 0.9; }
      }

      @keyframes pulseMid {
        0% { opacity: 0.4; }
        50% { opacity: 1.0; }
        100% { opacity: 0.6; }
      }

      @keyframes pulseFast {
        0% { opacity: 1.0; fill: #CC3333; }
        50% { opacity: 0.25; fill: #FF6666; }
        100% { opacity: 1.0; fill: #CC3333; }
      }

      @keyframes scanAnim {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.9; }
        100% { transform: translateY(330px); opacity: 0.1; }
      }

      @keyframes titleGlow {
        from { fill: #FF9900; }
        to { fill: #FFCC66; }
      }

      @keyframes cursorBlink {
        from, to { opacity: 1; }
        50% { opacity: 0; }
      }
      ]]>
    </style>

    <clipPath id="panel-clip">
      <rect x="62" y="65" width="4" height="335" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" class="bg-dark" rx="12" />

  <!-- ================= LCARS FRAME STRUCTURE ================= -->

  <!-- Top-Left Elbow (Sweep) -->
  <path d="M 20,20 H 140 V 52 H 75 A 15,15 0 0,0 60,67 V 110 H 20 V 35 A 15,15 0 0,1 35,20 Z" class="lcars-gold" />
  
  <!-- Top Horizontal Header Bar -->
  <rect x="148" y="20" width="460" height="32" class="lcars-gold" />
  <rect x="616" y="20" width="164" height="32" class="lcars-lilac" rx="16" />
  <text x="160" y="41" fill="#000000" font-weight="bold" font-size="14" class="lcars-text">LCARS 24-47 // COMMAND DIRECTIVE PROFILE</text>
  <text x="632" y="41" fill="#000000" font-weight="bold" font-size="13" class="lcars-text">SYS ONLINE</text>

  <!-- Left Sidebar Button Stack -->
  <rect x="20" y="116" width="40" height="28" class="lcars-tan blink-mid" rx="3" />
  <text x="25" y="134" fill="#000" font-size="10" class="lcars-text" font-weight="bold">47</text>

  <rect x="20" y="148" width="40" height="42" class="lcars-lilac blink-slow" rx="3" />
  <text x="25" y="172" fill="#000" font-size="10" class="lcars-text" font-weight="bold">9204</text>

  <rect x="20" y="194" width="40" height="20" class="lcars-blue" rx="3" />
  
  <rect x="20" y="218" width="40" height="55" class="lcars-gold blink-mid" rx="3" />
  <text x="25" y="248" fill="#000" font-size="10" class="lcars-text" font-weight="bold">OPS</text>

  <rect x="20" y="277" width="40" height="30" class="lcars-red blink-fast" rx="3" />
  <text x="25" y="296" fill="#000" font-size="10" class="lcars-text" font-weight="bold">ALT</text>

  <rect x="20" y="311" width="40" height="35" class="lcars-slate blink-slow" rx="3" />
  <text x="25" y="332" fill="#000" font-size="10" class="lcars-text" font-weight="bold">NET</text>

  <!-- Bottom-Left Elbow (Sweep) -->
  <path d="M 20,350 H 60 V 393 A 15,15 0 0,0 75,408 H 140 V 440 H 35 A 15,15 0 0,1 20,425 V 350 Z" class="lcars-tan" />

  <!-- Bottom Horizontal Footer Bar -->
  <rect x="148" y="408" width="500" height="32" class="lcars-blue" />
  <rect x="656" y="408" width="124" height="32" class="lcars-gold" rx="16" />
  <text x="160" y="429" fill="#000000" font-weight="bold" font-size="13" class="lcars-text">STARDATE 10425.8 // FEDERATION DATABASE ACCESS</text>
  <text x="672" y="429" fill="#000000" font-weight="bold" font-size="13" class="lcars-text">RECORDS</text>

  <!-- Sidebar Vertical Telemetry Scanner -->
  <rect x="62" y="65" width="4" height="335" class="lcars-blue" opacity="0.2" />
  <g clip-path="url(#panel-clip)">
    <rect x="60" y="65" width="8" height="40" fill="#99CCFF" class="scanner-beam" opacity="0.8" />
  </g>

  <!-- ================= MAIN CONTENT PANEL ================= -->

  <!-- Officer Identification Header -->
  <text x="175" y="94" class="lcars-text title-glow" font-size="32" font-weight="700">MIKE TAYLOR</text>
  <text x="365" y="94" class="lcars-text lcars-tan" font-size="16" font-weight="700">// PERSONNEL DOSSIER</text>

  <text x="175" y="116" class="lcars-text lcars-blue" font-size="11" font-weight="700">
    LOCATION: <tspan fill="#FFFFFF">NORTHERN VIRGINIA</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    CLEARANCE: <tspan fill="#FFCC99">LEVEL 10</tspan> &nbsp;&nbsp;|&nbsp;&nbsp; 
    STATUS: <tspan fill="#66FF66">ONLINE</tspan><tspan class="cursor-blink" fill="#66FF66">_</tspan>
  </text>

  <!-- Sub-divider line -->
  <line x1="175" y1="126" x2="770" y2="126" stroke="#CC99CC" stroke-width="2" stroke-dasharray="6 3" opacity="0.7" />

  <!-- SECTION 1: CORE SOFTWARE & PLATFORMS -->
  <g transform="translate(0, 5)">
    <rect x="175" y="138" width="225" height="22" class="lcars-lilac" rx="11" />
    <text x="190" y="153" fill="#000000" font-size="12" font-weight="700" class="lcars-text">01 // CORE SYSTEM SOFTWARE</text>
    <line x1="408" y1="149" x2="770" y2="149" stroke="#CC99CC" stroke-width="2" opacity="0.6" />

    <!-- Badges -->
    <rect x="175" y="170" width="155" height="24" class="lcars-gold" rx="12" />
    <text x="187" y="186" fill="#000" font-size="11" font-weight="bold" class="lcars-text">LINUX OS ARCHITECTURE</text>

    <rect x="338" y="170" width="85" height="24" class="lcars-tan" rx="12" />
    <text x="350" y="186" fill="#000" font-size="11" font-weight="bold" class="lcars-text">PYTHON 3</text>

    <rect x="431" y="170" width="75" height="24" class="lcars-blue" rx="12" />
    <text x="443" y="186" fill="#000" font-size="11" font-weight="bold" class="lcars-text">SQLITE</text>

    <rect x="514" y="170" width="155" height="24" class="lcars-lilac" rx="12" />
    <text x="526" y="186" fill="#000" font-size="11" font-weight="bold" class="lcars-text">HTML5 / CSS3 / JS</text>
  </g>

  <!-- SECTION 2: INFRASTRUCTURE & AUTOMATION -->
  <g transform="translate(0, 5)">
    <rect x="175" y="212" width="235" height="22" class="lcars-blue" rx="11" />
    <text x="190" y="227" fill="#000000" font-size="12" font-weight="700" class="lcars-text">02 // INFRASTRUCTURE &amp; DEVOPS</text>
    <line x1="418" y1="223" x2="770" y2="223" stroke="#99CCFF" stroke-width="2" opacity="0.6" />

    <!-- Badges Row 1 -->
    <rect x="175" y="244" width="165" height="24" class="lcars-blue" rx="12" />
    <text x="187" y="260" fill="#000" font-size="11" font-weight="bold" class="lcars-text">DOCKER &amp; SWARM</text>

    <rect x="348" y="244" width="200" height="24" class="lcars-tan" rx="12" />
    <text x="360" y="260" fill="#000" font-size="11" font-weight="bold" class="lcars-text">FORGEJO &amp; GITHUB ACTIONS</text>

    <rect x="556" y="244" width="135" height="24" class="lcars-gold" rx="12" />
    <text x="568" y="260" fill="#000" font-size="11" font-weight="bold" class="lcars-text">HARBOR REGISTRY</text>

    <!-- Badges Row 2 -->
    <rect x="175" y="276" width="170" height="24" class="lcars-slate" rx="12" />
    <text x="187" y="292" fill="#000" font-size="11" font-weight="bold" class="lcars-text">NGINX PROXY MANAGER</text>

    <rect x="353" y="276" width="130" height="24" class="lcars-lilac" rx="12" />
    <text x="365" y="292" fill="#000" font-size="11" font-weight="bold" class="lcars-text">CI/CD PIPELINES</text>
  </g>

  <!-- SECTION 3: AI & MODEL INTEGRATION -->
  <g transform="translate(0, 5)">
    <rect x="175" y="318" width="230" height="22" class="lcars-gold" rx="11" />
    <text x="190" y="333" fill="#000000" font-size="12" font-weight="700" class="lcars-text">03 // AI &amp; MODEL INTEGRATION</text>
    <line x1="413" y1="329" x2="770" y2="329" stroke="#FF9900" stroke-width="2" opacity="0.6" />

    <!-- Badges -->
    <rect x="175" y="350" width="115" height="24" class="lcars-gold" rx="12" />
    <text x="187" y="366" fill="#000" font-size="11" font-weight="bold" class="lcars-text">OPEN WEBUI</text>

    <rect x="298" y="350" width="140" height="24" class="lcars-tan" rx="12" />
    <text x="310" y="366" fill="#000" font-size="11" font-weight="bold" class="lcars-text">GEMMA MODELS</text>

    <rect x="446" y="350" width="155" height="24" class="lcars-blue" rx="12" />
    <text x="458" y="366" fill="#000" font-size="11" font-weight="bold" class="lcars-text">QWEN ARCHITECTURE</text>

    <rect x="609" y="350" width="115" height="24" class="lcars-lilac" rx="12" />
    <text x="621" y="366" fill="#000" font-size="11" font-weight="bold" class="lcars-text">DEEPSEEK-R1</text>
  </g>
</svg>
